# NG Devis — CI/CD Codemagic
# Flux : push sur la branche `dev` → build AAB release → publication Play Store (piste **production**).
#
# Prérequis (console Codemagic : https://codemagic.io)
# ─────────────────────────────────────────
# 1) Code signing — Android :
#    App settings → Code signing identities → téléverser votre keystore (même que pour vos builds locales).
#    L’identité Android injecte CM_KEYSTORE_* ; android/app/build.gradle.kts les utilise si key.properties est absent.
#
# 2) Google Play — compte de service :
#    Google Cloud Console : création d’un compte de service + clé JSON.
#    Play Console → Setup → API access : lier le compte avec les droits de publication vers **Production**.
#
#    Variables Codemagic — **au niveau de l’application NG Devis** :
#    Les variables « globales » du compte personnel sont dépréciées / lecture seule.
#    Dans **Application ngdevis → Environment variables**, Codemagic impose souvent un **groupe** :
#      a) Crée un groupe (ex. nom exact : google_play).
#      b) Ajoute une variable **secrète** dans ce groupe :
#           Nom exact : GOOGLE_PLAY_SERVICE_ACCOUNT_CREDENTIALS
#           Valeur : tout le contenu du fichier JSON du compte de service Google Cloud (pas du base64 pour ça).
#      c) Dans ce fichier YAML, la section `environment.groups` doit lister ce groupe (- google_play).
#
#    Note Codemagic sur le base64 : utile pour stocker des **fichiers binaires** dans une variable ;
#    pour le JSON Play, colle en général le texte brut dans une variable secrète (pas besoin de base64).
#
# ⚠️  versionCode : le bundle doit être **strictement supérieur** à tout code déjà utilisé sur Play (toutes pistes).
#     Le script lit Google Play sur plusieurs pistes + le +N de pubspec.yaml. Si l’API retourne un max trop bas
#     (cas fréquent), définis PLAY_MIN_NEXT_VERSION_CODE (dans ce YAML ou en variable d’app Codemagic), ex. 10.
#     Optionnel : PLAY_EXTRA_TRACKS pour d’autres noms de pistes (séparés par des virgules).
#
# ⚠️  Publier directement sur **production** à chaque push est risqué (régression utilisateur).
#    Prévoir des garde‑fous (revue obligatoire, branche protégée, etc.) selon votre organisation.
#
# Cache CI (gain de temps, contournement partiel des timeouts réseau Flutter) :
#    • Dans l’app Codemagic → onglet **Caching** / **Dependency caching** : activer le cache du workflow.
#    • Chemins ci‑dessous : paquets Dart, Gradle, SDK Flutter ($HOME/programs/flutter).
#    • Compte perso : limite **~3 Go** de cache — si dépassement, retire `programs/flutter` et ne garde que
#      .pub-cache + .gradle/caches (le 1er build peut encore télécharger Flutter).
#
workflows:
  dev-to-play-production:
    name: NG Devis Android → Play (production sur push dev)
    instance_type: mac_mini_m2
    max_build_duration: 120
    cache:
      cache_paths:
        - $HOME/.pub-cache
        - $HOME/.gradle/caches
        - $HOME/programs/flutter
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: dev
          include: true
          source: true

    environment:
      android_signing:
        # ⚠️ Identique au nom dans Codemagic → Code signing identities (chez toi : ngdevis).
        - ngdevis
      groups:
        # Doit être le **même nom** que le groupe créé dans App → Environment variables (ex. google_play).
        - google_play
      vars:
        PACKAGE_NAME: "com.devisng.app"
        GOOGLE_PLAY_TRACK: "production"
        # Pistes standards ; ajoute PLAY_EXTRA_TRACKS si tu as des pistes personnalisées (Play Console).
        PLAY_VERSION_LOOKUP_TRACKS: "production,internal,beta,alpha"
        # Si l’erreur revient même avec un pubspec.+N récent, mets ici strictement (> max vue sur Play), ex. 20.
        PLAY_MIN_NEXT_VERSION_CODE: ""
        PLAY_EXTRA_TRACKS: ""
      flutter: stable

    scripts:
      - name: Get Flutter packages
        script: |
          flutter pub get

      # Optionnel ; commentez ou mettez ignore_failure si vous préférez ne pas bloquer le déploiement.
      - name: Static analysis
        script: |
          dart analyze lib
        ignore_failure: true

      - name: Vérifier keystore release Codemagic (sinon AAB signé en debug → Play refuse)
        script: |
          if [ -z "$CM_KEYSTORE_PATH" ] || [ ! -f "$CM_KEYSTORE_PATH" ]; then
            echo "Erreur: CM_KEYSTORE_PATH absent ou fichier introuvable. Vérifie android_signing → ngdevis dans le YAML."
            exit 1
          fi
          echo "Keystore CI OK: $CM_KEYSTORE_PATH"

      - name: Build App Bundle (versionCode = max(Play API, pubspec +N) + 1, optionnel plancher)
        script: |
          set -e
          spec_build=$(grep -m1 '^version:' pubspec.yaml | sed -n 's/.*+\([0-9][0-9]*\).*$/\1/p')
          spec_build=${spec_build:-0}
          latest=0
          TRACKS="${PLAY_VERSION_LOOKUP_TRACKS}"
          if [ -n "${PLAY_EXTRA_TRACKS:-}" ]; then
            TRACKS="${TRACKS},${PLAY_EXTRA_TRACKS}"
          fi
          IFS=',' read -ra T <<< "${TRACKS}"
          for t in "${T[@]}"; do
            t=$(echo "$t" | xargs)
            [ -z "$t" ] && continue
            n=$(google-play get-latest-build-number \
              --package-name "$PACKAGE_NAME" \
              --tracks="$t" 2>/dev/null || true)
            if [[ "$n" =~ ^[0-9]+$ ]] && [ "$n" -gt "$latest" ]; then
              latest=$n
            fi
          done
          combined=$latest
          if [ "$spec_build" -gt "$combined" ]; then
            combined=$spec_build
          fi
          NEXT=$((combined + 1))
          if [[ "${PLAY_MIN_NEXT_VERSION_CODE:-}" =~ ^[0-9]+$ ]] && [ "$NEXT" -lt "$PLAY_MIN_NEXT_VERSION_CODE" ]; then
            echo "NEXT $NEXT < PLAY_MIN_NEXT_VERSION_CODE $PLAY_MIN_NEXT_VERSION_CODE — on applique le plancher."
            NEXT=$PLAY_MIN_NEXT_VERSION_CODE
          fi
          echo "versionCode: API max=$latest, pubspec+=$spec_build → combined=$combined → build avec versionCode=$NEXT"
          flutter build appbundle --release --build-number="$NEXT"

    artifacts:
      - build/**/outputs/**/*.aab
      - flutter_drive.log

    publishing:
      google_play:
        credentials: $GOOGLE_PLAY_SERVICE_ACCOUNT_CREDENTIALS
        track: production
        # false = mise en ligne sur la piste (pas uniquement draft). Respecte vos réglages de publication gérée Google Play.
        submit_as_draft: false


